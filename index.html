<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1, minimum-scale=1, viewport-fit=cover">
        <title>Fliptoons</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bakbak+One&display=swap" rel="stylesheet">
        <meta name="theme-color" content="#3790D2">
        <meta name="background-color" content="#3790D2">
        <link rel="manifest" href="manifest.json">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black">
        <meta name="apple-mobile-web-app-title" content="Fliptoons">
        <link rel="apple-touch-icon" href="icon.png">
        <link rel="icon" href="icon.png">
        <link rel="shortcut icon" href="icon.png">
        <link rel="apple-touch-icon" href="icon.png">

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Bakbak One', Arial, sans-serif;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                -khtml-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                -webkit-tap-highlight-color: transparent;
                user-select: none;
            }

            img {
                -webkit-user-drag: none;
                pointer-events: none;
            }

            html,
            body {
                touch-action: manipulation;
                overscroll-behavior: none;
            }

            body {
                height: 100dvh;
                display: flex;
                justify-content: center;
                align-items: center;
                background: #3790D2;
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }

            .placar {
                width: 65vw;
                height: 65vw;
                max-width: 320px;
                max-height: 320px;
                border-radius: 50%;
                background: #FFD700;
                color: #213349;
                border: 10px solid #213349;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 5rem;
                font-weight: bold;
                transition: all 0.2s ease;
                position: relative;
            }

            .placar:after {
                content: "";
                position: absolute;
                top: 10px;
                left: 10px;
                right: 10px;
                bottom: 10px;
                border-radius: 50%;
                border: 7px solid #213349;
            }

            .logo {
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                height: 100px;
            }

            .modal {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                display: none;
                justify-content: center;
                align-items: center;
                z-index: 50;
            }

            .modal-content {
                background-color: white;
                width: 90%;
                border-radius: 10px;
                padding: 15px;
            }

            .verde {
                background: #23B899;
                color: white;
            }

            .pulse {
                transform: scale(1.1);
            }

            .footer {
                position: fixed;
                bottom: 0;
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
            }

            .btn {
                height: 90px;
                border: none;
                font-size: 3rem;
                color: white;
            }

            .btn-info {
                background: rgba(255, 255, 255, 0.3);
                position: fixed;
                top: 10px;
                right: 10px;
                z-index: 40;
                border: none;
                width: 40px;
                height: 40px;
                border-radius: 100%;
                display: flex;
                color: #213349;
                align-items: center;
                justify-content: center;
                font-size: 1.2rem;
                line-height: 40px;
            }

            .menos {
                background: #D15B3B;
            }

            .reset {
                background: #54595F;
            }

            .mais {
                background: #23B899;
            }

            .btn.blink {
                transform: scale(1.1);
            }

            @media (max-width: 400px) {
                .placar {
                    font-size: 3.5rem;
                }

                .btn {
                    height: 80px;
                    font-size: 2.5rem;
                }

                .modal-content {
                    font-size: 0.9rem;
                }
            }
        </style>
    </head>

    <body>

        <img src="logo.webp" class="logo">

        <div class="modal" onclick="fechar()">
            <div class="modal-content">
                Fliptoons criado por Jordy Adan & Renato Simões<br>
                App desenvolvido por Gabriel Silva<br><br>
                Versão 1.0.0
            </div>
        </div>

        <div class="placar" id="placar">0</div>

        <div class="footer">
            <button class="btn menos" onclick="diminuir()">-</button>
            <button class="btn reset" onclick="resetar()">⟲</button>
            <button class="btn mais" onclick="aumentar()">+</button>
        </div>

        <button class="btn-info" onclick="abrir()">🛈</button>

        <script>
            let pontos = 0;
            const placar = document.getElementById("placar");
            const btnMais = document.querySelector(".btn.mais");
            const btnMenos = document.querySelector(".btn.menos");
            const btnReset = document.querySelector(".btn.reset");
            const modal = document.querySelector(".modal");

            function vibrar() {
                if(navigator.vibrate) navigator.vibrate(40);
            }

            function abrir() {
                modal.style.display = 'flex';
            }

            function fechar() {
                modal.style.display = 'none';
            }

            function pulse() {
                placar.classList.add("pulse");
                setTimeout(() => placar.classList.remove("pulse"), 120);
            }

            function atualizar() {
                placar.innerText = pontos;

                if(pontos >= 30) {
                    placar.classList.add("verde");
                } else {
                    placar.classList.remove("verde");
                }

                pulse();
            }

            function aumentar() {
                pontos++;
                vibrar();
                atualizar();
                btnMais.classList.add("blink");
                setTimeout(() => btnMais.classList.remove("blink"), 120);
            }

            function diminuir() {
                if(pontos > 0) {
                    pontos--;
                    vibrar();
                    atualizar();
                    btnMenos.classList.add("blink");
                    setTimeout(() => btnMenos.classList.remove("blink"), 120);
                }
            }

            function resetar() {
                pontos = 0;
                vibrar();
                atualizar();
                btnReset.classList.add("blink");
                setTimeout(() => btnReset.classList.remove("blink"), 120);
            }

            document.body.addEventListener("click", function(e) {
                const largura = window.innerWidth;
                const x = e.clientX;

                if(e.target.classList.contains("btn") || e.target.classList.contains("btn-info") || e.target.classList.contains("modal")) return;

                if(x < largura / 2) {
                    diminuir();
                } else {
                    aumentar();
                }
            });

            if('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js');
            }
        </script>

    </body>

</html>
